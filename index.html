<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" href="src/ui/style.css">
        <link rel="stylesheet" href="src/ui/home.css">
        <link rel="stylesheet" href="src/ui/about.css">
        <link rel="stylesheet" href="src/ui/catalogue.css"> 
        <link rel="stylesheet" href="src/ui/flea.css">
        <link rel="stylesheet" href="src/ui/community.css">
        <link rel="stylesheet" href="src/ui/login-signup.css">
        <link rel="stylesheet" href="src/ui/header.css">
        <title>SilipLokal</title>
    </head>
    <body>
        <!-- Header -->
        <header id="header">
            <nav class="site-nav" aria-label="Main navigation">
                <a class="brand" href="#home" data-page="home">
                    <img src="assets/logo.png" alt="SilipLokal Logo" class="logo">
                    <span class="brand-mark" aria-hidden="true">S</span>
                    <span>SilipLokal</span>
                </a>
                <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navMenu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="nav-menu" id="navMenu" aria-hidden="true" inert>
                    <div class="nav-links">
                        <div class="page-links">
                            <span class="nav-indicator" aria-hidden="true"></span>
                            <a href="#home" data-page="home">Home</a>
                            <a href="#about" data-page="about">About Us</a>
                            <a href="#catalogue" data-page="catalogue">Catalogue</a>
                            <a href="#flea" data-page="flea">Flea Markets</a>
                            <a href="#community" data-page="community">Community</a>
                        </div>
                        <div class="theme-picker">
                            <button class="theme-toggle" id="themeToggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu">
                                <span id="themeLabel">Light mode</span>
                                <span class="theme-chevron" aria-hidden="true"></span>
                            </button>
                            <div class="theme-menu" id="themeMenu" role="listbox" aria-label="Color theme" hidden>
                                <button type="button" role="option" data-theme-option="light" aria-selected="true">Light mode</button>
                                <button type="button" role="option" data-theme-option="dark" aria-selected="false">Dark mode</button>
                            </div>
                        </div>
                    </div>
                    <a class="account-link" href="#signup" data-page="signup">Sign up/Log in</a>
                </div>
            </nav>
        </header>
        
        <!-- Main Content -->
        <main id="app">
            <div class="loader-container">
                <img
                    src="assets/loader-icon.png"    
                    alt="Loading..." 
                    class="loader-icon"
                >
                <p>Loading...</p>
            </div>
        </main>
        
        <!-- Footer -->
        <footer id="footer">
            <div class="footer-inner">
                <section class="footer-identity" aria-label="SilipLokal social media">
                    <p class="footer-brand">SilipLokal</p>
                    <div class="footer-socials">
                        <a href="https://www.facebook.com/SilipLokal" target="_blank" rel="noopener noreferrer" aria-label="SilipLokal on Facebook">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.3v3h2.8v8h3.4Z"></path></svg>
                        </a>
                        <a href="https://www.instagram.com/SilipLokal" target="_blank" rel="noopener noreferrer" aria-label="SilipLokal on Instagram">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="footer-icon-dot" cx="17.5" cy="6.8" r="1"></circle></svg>
                        </a>
                        <a href="mailto:siliplokal@gmail.com" aria-label="Email SilipLokal">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect><path d="m3.5 6 8.5 7 8.5-7"></path></svg>
                        </a>
                    </div>
                </section>

                <p class="footer-tagline">Lorem Ipsum dolor sit Amet.</p>

                <nav class="footer-links" aria-label="Footer navigation">
                    <a href="#faq" data-page="faq">FAQs</a>
                    <a href="#terms" data-page="terms">Terms and Conditions</a>
                    <a href="#login" data-page="login">Log In</a>
                    <a href="#signup" data-page="signup">Sign Up</a>
                </nav>

                <section class="footer-contact" aria-labelledby="footer-contact-title">
                    <h2 id="footer-contact-title">Contact us at:</h2>
                    <a href="mailto:siliplokal@gmail.com">siliplokal@gmail.com</a>
                    <p>SilipLokal</p>
                    <a href="tel:+639767676767">+63 9767676767</a>
                </section>

                <p class="footer-copyright">&copy; 2026 SilipLokal. All rights reserved.</p>
            </div>
        </footer>

        <script src="src/script/app.js"></script>
        <script src="src/script/featured-brands.js"></script>
        <script src="src/script/home-showcase.js"></script>
        <script src="src/script/catalogue.js"></script>
        <script src="src/script/flea.js"></script>
        <script src="src/script/community.js"></script>
        <script src="src/script/login-signup.js"></script>
        <script src="src/script/nav.js"></script>
    </body>
</html>

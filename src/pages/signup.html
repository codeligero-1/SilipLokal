<section class="auth-page" data-auth-page aria-labelledby="auth-brand-title">
    <a class="auth-brand" href="#home" data-page="home">
        <img src="assets/logo.png" alt="" width="38" height="38">
        <span>Siliplokal</span>
    </a>

    <div class="auth-layout">
        <div class="auth-content">
            <header class="auth-intro">
                <h1 id="auth-brand-title">SilipLokal</h1>
                <p>Lorem, Ipsum dolor sit Amet.</p>
            </header>

            <section class="auth-panel" aria-labelledby="auth-form-title">
                <h2 id="auth-form-title">Sign up</h2>
                <form class="auth-form" data-auth-form="signup">
                    <label class="visually-hidden" for="signup-username">Username</label>
                    <input id="signup-username" name="username" type="text" placeholder="Username" autocomplete="username" minlength="3" maxlength="30" required>
                    <label class="visually-hidden" for="signup-email">E-mail</label>
                    <input id="signup-email" name="email" type="email" placeholder="E-mail" autocomplete="email" required>
                    <label class="visually-hidden" for="signup-password">Password</label>
                    <input id="signup-password" name="password" type="password" placeholder="Password (at least 8 characters)" autocomplete="new-password" minlength="8" required>
                    <button class="auth-primary-button" type="submit">SIGN UP</button>
                </form>

                <div class="auth-divider" aria-hidden="true"><span>or</span></div>
                <div class="auth-social-options" aria-label="Alternative sign-up options">
                    <button class="auth-social-button" type="button" disabled title="Google sign-in is not configured">
                        <span class="auth-social-icon" aria-hidden="true">G</span>Sign up with Google
                    </button>
                    <button class="auth-social-button" type="button" disabled title="Facebook sign-in is not configured">
                        <span class="auth-social-icon" aria-hidden="true">f</span>Sign up with Facebook
                    </button>
                </div>
                <p class="auth-social-note">Social sign-in is not configured yet.</p>
                <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
                <p class="auth-switch">Already have an account? <a href="#login" data-page="login">Sign in here.</a></p>
            </section>
        </div>

        <img class="auth-image" src="assets/auth-image-placeholder.svg" alt="Neutral image placeholder" width="640" height="800">
    </div>
</section>
